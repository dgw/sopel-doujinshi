[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
platforms = ["Linux x86, x86-64"]

[tool.setuptools.packages.find]
include = ["sopel_doujinshi", "sopel_doujinshi.*"]
namespaces = false

[tool.setuptools.dynamic]
readme = { file=["README.md", "NEWS"], content-type="text/markdown" }

[project]
name = "sopel-doujinshi"
version = "0.1.0"
description = "Sopel plugin to fetch info about doujins linked on IRC"

authors = [
  { name="dgw", email="dgw@technobabbl.es" },
]

license = "EFL-2.0"
license-files = ["COPYING"]
dynamic = ["readme"]

classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Topic :: Communications :: Chat :: Internet Relay Chat",
]
keywords = [
  "sopel",
  "plugin",
  "bot",
  "irc",
]

requires-python = ">=3.8, <4"
dependencies = [
  "sopel>=8.0",
  "requests",  # let Sopel choose the exact version
  "lxml",  # any version compatible with the target Python range should work
]

[project.urls]
"Homepage" = "https://github.com/dgw/sopel-doujinshi"
"Bug Tracker" = "https://github.com/dgw/sopel-doujinshi/issues"

[project.entry-points."sopel.plugins"]
"doujinshi" = "sopel_doujinshi.plugin"
